name: Claw
options:
  bundleIdPrefix: ai.clawos
  deploymentTarget:
    iOS: "17.0"
packages:
  ClawShared:
    path: ClawShared
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: "2.3.1"
  Citadel:
    url: https://github.com/orlandos-nl/Citadel
    from: "0.7.0"
targets:
  Claw:
    type: application
    platform: iOS
    sources: [Claw]
    configFiles:
      Debug: Claw/Config/Secrets.xcconfig
      Release: Claw/Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.clawos.app
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: UD4F4U8M59
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    entitlements:
      path: Claw/Claw.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.ai.clawos.shared
    dependencies:
      - target: ClawWidgets
      - target: ClawShareExtension
      - package: ClawShared
        product: ClawShared
      - package: MarkdownUI
        product: MarkdownUI
      - package: Citadel
        product: Citadel
      - sdk: BackgroundTasks.framework
        embed: false
      - sdk: WatchConnectivity.framework
        embed: false
    info:
      path: Claw/Info.plist
      properties:
        CFBundleDisplayName: Claw
        GITHUB_CLIENT_ID: "$(GITHUB_CLIENT_ID)"
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        NSBonjourServices:
          - _openclaw._tcp.
        NSCalendarsFullAccessUsageDescription: "Claw can share your calendar with the agent to answer scheduling questions."
        NSContactsUsageDescription: "Claw can share your contacts with the agent to help you communicate."
        NSLocalNetworkUsageDescription: "Claw needs local network access to discover AI agent gateways on your network."
        NSCameraUsageDescription: "Claw uses the camera to scan QR codes for quick gateway setup."
        # No ATS exceptions: all gateway traffic uses WSS, and all external API
        # clients (GitHub / Datadog / AWS) hardcode HTTPS. Previously this
        # block allowed insecure HTTP loads to *.ts.net, which is unused.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSMicrophoneUsageDescription: "Claw uses the microphone to transcribe voice messages."
        NSRemindersFullAccessUsageDescription: "Claw can share your reminders with the agent to help you stay on track."
        NSSpeechRecognitionUsageDescription: "Claw uses speech recognition to convert your voice to text."
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - ai.clawos.health-check
        UILaunchScreen:
          UIColorName: ""
          UIImageName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        CFBundleURLTypes:
          - CFBundleURLName: ai.clawos.oauth
            CFBundleURLSchemes:
              - claw

  ClawShareExtension:
    type: app-extension
    platform: iOS
    # Extension uses its own UI + shared lightweight model files.
    # No GatewayClient, Citadel, or main-app stores are included.
    sources:
      - path: ClawShareExtension
      # Shared model/service files — safe to compile in the extension
      - path: Claw/Models/ShareIntakeItem.swift
      - path: Claw/Models/VoiceCommandIntent.swift   # for VoiceCommandRisk
      - path: Claw/Services/Share/ShareIntakeQueue.swift
      - path: Claw/Services/Share/ShareMetadataExtractor.swift
      - path: Claw/Views/Share/ShareActionPickerView.swift
      - path: Claw/Theme/ClawTheme.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.clawos.app.share
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: UD4F4U8M59
    entitlements:
      path: ClawShareExtension/ClawShareExtension.entitlements
      properties:
        com.apple.security.application-groups:
          - group.ai.clawos.shared
    info:
      path: ClawShareExtension/Info.plist

  ClawWidgets:
    type: app-extension
    platform: iOS
    sources: [ClawWidgets]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.clawos.app.widgets
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: UD4F4U8M59
    dependencies:
      - package: ClawShared
        product: ClawShared
    info:
      path: ClawWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ClawWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources: [ClawWatch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.clawos.app.watchkitapp
        SWIFT_VERSION: 5.9
        DEVELOPMENT_TEAM: UD4F4U8M59
    dependencies:
      - package: ClawShared
        product: ClawShared
      - sdk: WatchConnectivity.framework
        embed: false
    info:
      path: ClawWatch/Info.plist
      properties:
        CFBundleDisplayName: Claw
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        WKCompanionAppBundleIdentifier: ai.clawos.app
        # Background modes for Watch: allows receiving WCSession transfers
        # while the Watch app is not in the foreground.
        UIBackgroundModes:
          - background-app-refresh
          - watchkit-background-fetch
